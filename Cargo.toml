[package]
name = "bevy-spritesim"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"
all = "warn"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.19.0", features = ["dynamic_linking", "debug", "bevy_dev_tools", "trace", "sprite_picking"] }
bevy_framepace = "0.21"
noisy_bevy = "0.14.0"
rand = "0.9.2"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false
